{{- if .Values.adminIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-admin
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.adminIngress.clusterIssuer }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.adminIngress.authSecret }}
    nginx.ingress.kubernetes.io/auth-realm: "hub-bill admin"
spec:
  ingressClassName: {{ .Values.adminIngress.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.adminIngress.host }}
      secretName: {{ .Release.Name }}-admin-tls
  rules:
    - host: {{ .Values.adminIngress.host }}
      http:
        paths:
          # Only /admin is exposed publicly - /reports/* (PDF generation, no auth) stays
          # internal-only via the ClusterIP service (see app-service.yaml).
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-app
                port:
                  number: {{ .Values.service.port }}
{{- end }}