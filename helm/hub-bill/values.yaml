image:
  repository: docker-registry.registry.svc.cluster.local:5000/hub-bill
  tag: latest
  pullPolicy: Always

app:
  replicaCount: 2
  containerPort: 3000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 1Gi

service:
  # ClusterIP: internal-only, consumed by other apps inside the namespace.
  type: ClusterIP
  port: 3000

metrics:
  portName: http

database:
  # Enables tenant-aware report rendering (templates/logo/signature stored per tenant).
  # When false, the app runs exactly as without a database - filesystem templates only.
  # host/name/existingSecret match the shared "postgres" instance and "hub-bill-db" Secret
  # provisioned by k8s_pulumi/pulumi_hetzner (deployHubBillDb).
  enabled: true
  host: postgres
  port: 5432
  name: hub_bill
  existingSecret: hub-bill-db
  secretUsernameKey: username
  secretPasswordKey: password
